# NooblyJS Core — CI gate (N-1 / P0-6).
# Runs unit tests with a coverage threshold, Playwright UI tests, a production
# dependency audit and a Docker build on every push and pull request.
# To block merges on failure, mark these jobs as required status checks in the
# repository's branch protection settings.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Jest with coverage threshold
        run: npm run coverage
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .temp/coverage
          retention-days: 14

  ui:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .temp/tests/playwright
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: No high/critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t nooblyjs-core:ci .
      - name: Refuses to start without secrets
        run: |
          if timeout 30 docker run --rm nooblyjs-core:ci; then
            echo "Container started without SESSION_SECRET/API keys" && exit 1
          fi
      - name: Becomes healthy with secrets
        run: |
          docker run -d --name app -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e API_KEYS="$(openssl rand -hex 32)" nooblyjs-core:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker logs app
          exit 1
