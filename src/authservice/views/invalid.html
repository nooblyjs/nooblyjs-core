<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Access Denied - NooblyJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/services/css/styles.css">
    <style>
        /* Restore 12px base font: this page is sized in rem against a 12px root
           (previously provided by public/styles.css before the CSS consolidation). */
        html { font-size: 12px; }
        :root {
            --custom-primary: #059DA2;
            --custom-secondary: #6c757d;
            --custom-warning: #ffc107;
        }

        body.loading {
            opacity: 0;
        }

        body {
            opacity: 1;
            transition: opacity 0.3s ease-in;
        }

        .auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        .auth-card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: none;
            border-radius: 1rem;
            max-width: 360px;
            width: 100%;
            aspect-ratio: 0.75;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card .card-body {
            padding: 1.5rem !important;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .auth-logo {
            color: #059DA2;
            font-weight: 700;
            font-size: 1.5rem;
            margin: 0;
        }

        .auth-card .text-center {
            margin-bottom: 1rem !important;
        }

        .auth-card .text-center img {
            max-height: 60px !important;
            margin-bottom: 0.5rem !important;
        }

        .auth-card .text-center p {
            font-size: 0.875rem;
            margin: 0.5rem 0 0 0;
        }

        .icon-lock {
            font-size: 3rem;
            color: #dc3545;
            margin-bottom: 0.75rem;
        }

        .btn-secondary {
            background-color: #059DA2;
            border-color: #059DA2;
            font-size: 0.875rem;
            padding: 0.5rem 1rem !important;
        }

        .btn-secondary:hover {
            background-color: #016165;
            border-color: #016165;
        }

        .alert-message {
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            color: #6c757d;
        }

        .alert-message strong {
            color: #059DA2;
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .auth-card .btn {
            font-size: 0.875rem;
            padding: 0.5rem 1rem !important;
        }

        .form-control:focus {
            border-color: #059DA2;
            box-shadow: 0 0 0 0.2rem rgba(2, 121, 125, 0.25);
        }

        .auth-link {
            color: #059DA2;
            text-decoration: none;
            font-size: 0.875rem;
        }

        .auth-link:hover {
            color: #016165;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="card auth-card">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <div id="logo-container" class="mb-3">
                                    <img src="/images/nooblyjs-logo.png" alt="NooblyJS Logo" style="max-height: 80px; width: auto; margin-bottom: 1rem;">
                                    <div class="auth-logo" id="app-name">NooblyJS</div>
                                </div>
                            </div>

                            <div class="text-center mb-4">
                                <i class="bi bi-shield-lock icon-lock"></i>
                                <h4 class="text-danger fw-bold mb-3">Access Restricted</h4>
                                <div class="alert-message">
                                    <strong>Insufficient Privileges</strong>
                                    You don't have the required Administrator role to access the Services Portal.
                                    Please contact your system administrator if you believe this is an error.
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-secondary" onclick="signOut()">Sign Out</button>
                                <a href="/services/authservice/views/login.html" class="btn btn-outline-secondary mt-2">Return to Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mark page as loading to hide content until branding is applied
        document.body.classList.add('loading');

        // Load and apply branding configuration
        let brandingConfig = null;

        async function loadBranding() {
            try {
                const response = await fetch('/services/authservice/api/branding');
                const result = await response.json();

                if (result.success && result.data) {
                    brandingConfig = result.data;
                    applyBranding();
                }
            } catch (error) {
                console.error('Failed to load branding configuration:', error);
            } finally {
                // Show page (either with branding applied or defaults)
                showPage();
            }
        }

        function applyBranding() {
            if (!brandingConfig) return;

            // Update page title
            if (brandingConfig.appName) {
                document.getElementById('page-title').textContent = `Access Restricted - ${brandingConfig.appName}`;
            }

            // Update app name display
            const appNameEl = document.getElementById('app-name');
            if (brandingConfig.appName) {
                appNameEl.textContent = brandingConfig.appName;
            }

            // Add logo if provided (use default NooblyJS logo if not)
            const logoContainer = document.getElementById('logo-container');
            const logoUrl = brandingConfig.logoUrl || '/images/nooblyjs-logo.png';
            logoContainer.innerHTML = `<img src="${logoUrl}" alt="${brandingConfig.appName || 'Logo'}" style="max-height: 80px; width: auto; margin-bottom: 1rem;"><div class="auth-logo" id="app-name">${brandingConfig.appName || 'NooblyJS'}</div>`;

            // Apply custom colors to CSS variables.
            // Note: the primary color is intentionally fixed (#059DA2) on this
            // shared auth screen for cross-site consistency, so any per-site
            // brandingConfig.primaryColor is deliberately ignored here.
            const root = document.documentElement;
            if (brandingConfig.secondaryColor) {
                root.style.setProperty('--custom-secondary', brandingConfig.secondaryColor);
            }
            if (brandingConfig.warningColor) {
                root.style.setProperty('--custom-warning', brandingConfig.warningColor);
            }

            // Load custom stylesheet if provided
            if (brandingConfig.stylesheetUrl) {
                const stylesheetLink = document.getElementById('custom-stylesheet');
                stylesheetLink.href = brandingConfig.stylesheetUrl;
            }
        }

        function showPage() {
            // Remove loading class to show page with branding applied
            document.body.classList.remove('loading');
        }

        // Load branding on page load
        loadBranding();

        async function signOut() {
            const authToken = localStorage.getItem('authToken');

            // Call logout API if token exists
            if (authToken) {
                try {
                    await fetch('/services/authservice/api/logout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token: authToken })
                    });
                } catch (error) {
                    // Ignore errors, proceed with local cleanup
                    console.error('Logout error:', error);
                }
            }

            // Clear stored authentication data
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');

            // Redirect to login page
            window.location.href = '/services/authservice/views/login.html';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
