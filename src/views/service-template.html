<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[SERVICE_TITLE]] - NooblyJS Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/kr-modern.css">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="kr-app no-ai">
    <!-- Topbar -->
    <header class="kr-topbar">
        <div class="kr-brand">
            <div class="logo">NJS</div>
            <div class="name">[[SERVICE_TITLE]]<small>Core</small></div>
        </div>
        <div class="kr-search">
            <div class="wrap">
                <i class="bi bi-search"></i>
                <input placeholder="Search…">
            </div>
        </div>
        <div class="kr-topbar-actions">
            <button class="kr-icon-btn" title="Back" onclick="window.location.href='/services/'"><i class="bi bi-house-door"></i></button>
            <button class="kr-icon-btn" title="Help"><i class="bi bi-question-circle"></i></button>
            <div class="kr-avatar-pill">
                <span id="headerUserName">User</span>
                <div class="av" id="headerUserAvatar">U</div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="kr-sidebar" id="navigation-sidebar">
        <!-- Navigation will be populated by navigation.js -->
    </aside>

    <!-- Main Content -->
    <main class="kr-main">
        <!-- Page Title -->
        <div class="kr-page-hero" style="margin-bottom: 20px;">
            <h1>[[SERVICE_TITLE]]</h1>
            <p>[[SERVICE_SUBTITLE]]</p>
        </div>

        <!-- Alerts -->
        <div class="alert alert-success alert-dismissible fade" id="successAlert" role="alert" style="display: none;">
            <strong>Success!</strong> <span id="successMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="alert alert-danger alert-dismissible fade" id="errorAlert" role="alert" style="display: none;">
            <strong>Error!</strong> <span id="errorMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Instance Selector (if applicable) -->
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; margin-bottom: 1.5rem;" id="instanceSelectorContainer" style="display: none;">
            <div>
                <label for="instanceSelector" style="margin-right: 8px; font-weight: 500;">Instance:</label>
                <select id="instanceSelector" style="width: 200px; display: inline-block; padding: 8px 12px; border: 1px solid var(--kr-border); border-radius: 8px; font-family: inherit;">
                    <option value="default">default</option>
                </select>
            </div>
            <button id="refreshInstanceBtn" class="kr-btn outline" title="Refresh instances list">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>

        <!-- Tabs -->
        <div class="kr-tabs">
            <div class="tab-strip">
                <button class="tab-btn active" data-bs-toggle="tab" data-bs-target="#dashboard" role="tab">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </button>
                <button class="tab-btn" data-bs-toggle="tab" data-bs-target="#data" role="tab">
                    <i class="bi bi-database"></i> Data
                </button>
                <button class="tab-btn" data-bs-toggle="tab" data-bs-target="#settings" role="tab">
                    <i class="bi bi-gear"></i> Settings
                </button>
            </div>

            <!-- Tab Content -->
            <div class="tab-pane active" id="dashboard" role="tabpanel">
                <div class="kr-surface">
                    <div class="kr-surface-head">
                        <h3>Dashboard</h3>
                    </div>
                    <div class="kr-surface-body p-3">
                        <p style="color: var(--kr-ink-500);">Dashboard content will be populated by service-specific script</p>
                    </div>
                </div>
            </div>

            <div class="tab-pane" id="data" role="tabpanel">
                <div class="kr-surface">
                    <div class="kr-surface-head">
                        <h3>Data Operations</h3>
                    </div>
                    <div class="kr-surface-body p-3">
                        <p style="color: var(--kr-ink-500);">Data content will be populated by service-specific script</p>
                    </div>
                </div>
            </div>

            <div class="tab-pane" id="settings" role="tabpanel" style="min-height:1000px">
                <div class="kr-surface">
                    <div class="kr-surface-head">
                        <h3>Service Settings</h3>
                    </div>
                    <div class="kr-surface-body p-3">
                        <form id="settingsForm">
                            <div id="settingsFormFields"></div>
                            <div style="margin-top: 20px; display: flex; gap: 10px;">
                                <button type="submit" class="kr-btn solid">Save Settings</button>
                                <button type="button" class="kr-btn outline" onclick="loadSettings()">Reload</button>
                            </div>
                        </form>
                        <div id="settingsSaveResponse" style="display: none; margin-top: 1rem;">
                            <div style="font-weight: 600; margin-bottom: 8px;">Save Response:</div>
                            <div id="settingsSaveResponseContent" style="background: var(--kr-surface-2); padding: 12px; border-radius: 8px; font-size: 12px; color: var(--kr-ink-700); overflow-x: auto; max-height: 200px; overflow-y: auto; font-family: 'JetBrains Mono', monospace;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-bundle.js"></script>
    <script src="/services/js/navigation.js"></script>

    <script>
        // Initialize navigation
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof NooblyJSNavigation !== 'undefined') {
                NooblyJSNavigation.renderNavigation('navigation-sidebar', '[[SERVICE_NAME]]');
            }
        });

        // Shared utility functions
        function showAlert(message, type = 'success') {
            const alertElement = document.getElementById(type + 'Alert');
            const messageElement = document.getElementById(type + 'Message');
            if (messageElement && alertElement) {
                messageElement.textContent = message;
                alertElement.style.display = 'block';
                const alert = new bootstrap.Alert(alertElement);
                setTimeout(() => alert.close(), 5000);
            }
        }

        function showResponse(containerId, contentId, data) {
            const container = document.getElementById(containerId);
            const content = document.getElementById(contentId);
            if (content && container) {
                content.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
                container.style.display = 'block';
            }
        }

        function setLoading(formId, isLoading) {
            const form = document.getElementById(formId);
            if (form) {
                const buttons = form.querySelectorAll('button');
                buttons.forEach(btn => btn.disabled = isLoading);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Settings form submission handler
        document.getElementById('settingsForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const formData = new FormData(document.getElementById('settingsForm'));
                const payload = {};

                for (let [key, value] of formData.entries()) {
                    payload[key] = value;
                }

                const response = await fetch('./api/settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                const responseText = await response.text();
                showResponse('settingsSaveResponse', 'settingsSaveResponseContent', responseText);

                if (response.ok) {
                    showAlert('Settings saved successfully', 'success');
                    setTimeout(() => loadSettings(), 1000);
                } else {
                    showAlert('Error saving settings: ' + responseText, 'error');
                }
            } catch (error) {
                showAlert('Error saving settings: ' + error.message, 'error');
                showResponse('settingsSaveResponse', 'settingsSaveResponseContent', 'Error: ' + error.message);
            }
        });

        // Load settings form
        async function loadSettings() {
            try {
                const response = await fetch('./api/settings');
                const data = await response.json();
                renderSettingsForm(data);
            } catch (error) {
                showAlert('Error loading settings: ' + error.message, 'error');
                console.error('Error loading settings:', error);
            }
        }

        function renderSettingsForm(data) {
            const formFieldsContainer = document.getElementById('settingsFormFields');
            formFieldsContainer.innerHTML = '';

            if (data.list && Array.isArray(data.list)) {
                data.list.forEach((setting) => {
                    const formGroup = createFormField(setting, data);
                    formFieldsContainer.appendChild(formGroup);
                });
            }
        }

        function createFormField(setting, settingsData) {
            const formGroup = document.createElement('div');
            formGroup.className = 'kr-form-group';

            const label = document.createElement('label');
            label.htmlFor = 'setting_' + setting.setting;
            label.textContent = setting.setting;
            formGroup.appendChild(label);

            const currentValue = settingsData[setting.setting] || '';

            let input;
            switch (setting.type) {
                case 'string':
                    input = document.createElement('input');
                    input.type = 'text';
                    input.id = 'setting_' + setting.setting;
                    input.name = setting.setting;
                    input.value = currentValue;
                    break;

                case 'integer':
                case 'number':
                    input = document.createElement('input');
                    input.type = 'number';
                    input.id = 'setting_' + setting.setting;
                    input.name = setting.setting;
                    input.value = currentValue;
                    input.step = setting.type === 'integer' ? '1' : 'any';
                    break;

                case 'list':
                case 'options':
                    input = document.createElement('select');
                    input.id = 'setting_' + setting.setting;
                    input.name = setting.setting;

                    if (setting.values && Array.isArray(setting.values)) {
                        setting.values.forEach((value) => {
                            const option = document.createElement('option');
                            option.value = value;
                            option.textContent = value;
                            if (value === currentValue) {
                                option.selected = true;
                            }
                            input.appendChild(option);
                        });
                    }
                    break;

                default:
                    input = document.createElement('input');
                    input.type = 'text';
                    input.id = 'setting_' + setting.setting;
                    input.name = setting.setting;
                    input.value = currentValue;
            }

            formGroup.appendChild(input);

            if (setting.description || setting.desciption) {
                const helperText = document.createElement('div');
                helperText.style.fontSize = '12px';
                helperText.style.color = 'var(--kr-ink-400)';
                helperText.style.marginTop = '4px';
                helperText.textContent = setting.description || setting.desciption;
                formGroup.appendChild(helperText);
            }

            return formGroup;
        }

        // Load settings when settings tab is shown
        document.getElementById('settings-tab')?.addEventListener('shown.bs.tab', function (e) {
            loadSettings();
        });
    </script>
</body>
</html>
